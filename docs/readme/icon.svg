    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#night)"/>
  <path d="M236 420 L236 712 Q236 742 266 742 L718 742 Q748 742 748 712 L748 420 Q748 390 718 390 L676 390 L640 300 L590 390 L394 390 L344 300 L308 390 L266 390 Q236 390 236 420 Z" fill="none" stroke="#F5BA7A" stroke-width="34" stroke-linejoin="round"/>
